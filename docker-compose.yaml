services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ecommerce_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ecommerce-app:
    build: ./ecommerce-app
    environment:
      - DD_AGENT_HOST=datadog-agent
      - DD_TRACE_AGENT_PORT=8126
      - DD_ENV=prod
      - DD_SERVICE=ecommerce-checkout-api
      - DD_VERSION=1.0.0
      - DD_LOGS_INJECTION=true
      - DD_TRACE_SAMPLE_RATE=1.0
    labels:
      com.datadoghq.ad.logs: '[{"source": "python", "service": "ecommerce-checkout-api"}]'
      com.datadoghq.tags.env: "prod"
      com.datadoghq.tags.service: "ecommerce-checkout-api"
      com.datadoghq.tags.version: "1.0.0"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - datadog-agent

  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    env_file:
      - .env
    environment:
      - DD_APM_ENABLED=true
      - DD_APM_NON_LOCAL_TRAFFIC=true
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_PROCESS_AGENT_ENABLED=true
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true
      - DD_CONTAINER_EXCLUDE="name:datadog-agent"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./datadog-conf/postgres.d:/etc/datadog-agent/conf.d/postgres.d
      - ./datadog-conf/redisdb.d:/etc/datadog-agent/conf.d/redisdb.d
    ports:
      - "8126:8126"
      - "8125:8125/udp"
